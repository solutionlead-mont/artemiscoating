      <circle cx="24" cy="52" r="4" fill="#8A5B2E" opacity="0.9"/>
      <circle cx="58" cy="60" r="5" fill="#D9A35E" opacity="0.85"/>
      <circle cx="84" cy="74" r="3" fill="#F0D8B8" opacity="0.9"/>
